name: Build and Deploy Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Check if Signing Key is Provided
        id: check_signing
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
            echo "Android release key found. Will proceed with signing."
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "No Android release key (SIGNING_KEY) found. Building unsigned/debug APK."
          fi

      - name: Sign APK
        if: steps.check_signing.outputs.has_key == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Decoding signing key..."
          echo "$SIGNING_KEY" | base64 -d > release.keystore

          # Find build-tools
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android SDK Build-Tools from: $BUILD_TOOLS_DIR"

          # Find the unsigned APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "❌ ERROR: No Release APK found to sign!"
            exit 1
          fi
          echo "Found Unsigned APK: $UNSIGNED_APK"

          # Align the APK
          $BUILD_TOOLS_DIR/zipalign -f -v -p 4 "$UNSIGNED_APK" aligned.apk

          # Sign the APK
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass pass:"$KEY_STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out signed.apk aligned.apk

          # Verify the signature
          $BUILD_TOOLS_DIR/apksigner verify signed.apk

          # Repackage the signed APK back to output folder
          ORIGINAL_NAME=$(basename "$UNSIGNED_APK")
          SIGNED_NAME="${ORIGINAL_NAME%.apk}-signed.apk"
          mv signed.apk "app/build/outputs/apk/release/$SIGNED_NAME"
          echo "Successfully created signed APK: app/build/outputs/apk/release/$SIGNED_NAME"

          # Clean up the keystore
          rm -f release.keystore aligned.apk

      - name: Rename and Prepare APK
        id: prepare_apk
        run: |
          # 1. Determine the path of the APK we want to use (prefer signed)
          if [ "${{ steps.check_signing.outputs.has_key }}" = "true" ]; then
            SOURCE_APK=$(find app/build/outputs/apk/release -name "*-signed.apk" | head -n 1)
          else
            SOURCE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi

          if [ -z "$SOURCE_APK" ]; then
            echo "❌ ERROR: No release APK found!"
            exit 1
          fi

          echo "Found source APK: $SOURCE_APK"

          # 2. Get variables for renaming
          DATE=$(date +'%Y%m%d')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          APP_NAME="smartbedlightcontrol"
          VERSION=$(sed -n 's/.*versionName.*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)

          # 3. Create destination name
          if [ -n "$VERSION" ]; then
            NEW_NAME="${APP_NAME}-v${VERSION}-${DATE}-${COMMIT_HASH}.apk"
          else
            NEW_NAME="${APP_NAME}-${DATE}-${COMMIT_HASH}.apk"
          fi

          DEST_PATH="app/build/outputs/apk/release/${NEW_NAME}"

          # 4. Rename (mv) the file
          mv "$SOURCE_APK" "$DEST_PATH"
          echo "Successfully renamed APK to: $DEST_PATH"
          echo "apk_path=${DEST_PATH}" >> $GITHUB_OUTPUT
          echo "apk_name=${NEW_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing. Skipping telegram upload."
            exit 0
          fi

          # Locate the prepared APK path dynamically
          APK_PATH="${{ steps.prepare_apk.outputs.apk_path }}"

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ ERROR: Prepared APK file not found at: $APK_PATH"
            exit 1
          fi

          FILE_NAME=$(basename "$APK_PATH")
          echo "Found APK to upload: $APK_PATH ($FILE_NAME)"

          # Send the APK document to Telegram Bot
          curl -f -F document=@"$APK_PATH" \
               -F chat_id="$TELEGRAM_CHAT_ID" \
               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
               -F caption="📱 *${FILE_NAME}* 已经成功编译并打包！" \
               -F parse_mode="Markdown"
